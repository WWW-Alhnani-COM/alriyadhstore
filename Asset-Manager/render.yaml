services:
  - type: web
    name: riyadhstore-api
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: riyadhstore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/storefront/categories

  - type: web
    name: riyadhstore-web
    runtime: static
    buildCommand: cd artifacts/store && npx vite build --config vite.config.ts
    staticPublishPath: ./artifacts/store/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://riyadhstore-api.onrender.com/api/$1
      - type: rewrite
        source: /(.*)
        destination: /index.html
    envVars:
      - key: BASE_PATH
        value: /

databases:
  - name: riyadhstore-db
    plan: free
    ipAllowList: []
