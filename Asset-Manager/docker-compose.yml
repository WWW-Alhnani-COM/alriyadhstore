version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: riyadhstore-db
    environment:
      POSTGRES_USER: riyadhstore
      POSTGRES_PASSWORD: riyadhstore
      POSTGRES_DB: riyadhstore
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riyadhstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riyadhstore-api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://riyadhstore:riyadhstore@db:5432/riyadhstore
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
